<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NagisinnraLinux Compatibility Checker</title>
<style>
:root{
    --bg:#f7f8f5;
    --card:#ffffff;
    --matcha:#dfe8d8;
    --matcha-dark:#7f9b7b;
    --good:#7aa46f;
    --warn:#d9b86c;
    --bad:#c68d8d;
    --text:#2f3430;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px;
}
.container{
    width:100%;
    max-width:760px;
}
/* 言語切り替えスイッチ（元のデザインに馴染むスタイル） */
.top-bar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
}
.lang-switch{
    background:white;
    padding:4px;
    border-radius:999px;
    display:inline-flex;
    box-shadow:0 4px 12px rgba(0,0,0,.03);
    gap:4px;
}
.lang-btn{
    border:none;
    background:transparent;
    padding:6px 14px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:700;
    color:#6b716c;
    cursor:pointer;
    transition:.2s;
}
.lang-btn:hover{
    color:var(--text);
}
.lang-btn.active{
    background:var(--matcha);
    color:var(--text);
}

.hero{
    text-align:center;
    margin-bottom:40px;
}
.hero h1{
    font-size:3rem;
    font-weight:700;
    margin-bottom:10px;
}
.hero p{
    color:#6b716c;
    font-size:1.1rem;
}
.card{
    background:white;
    border-radius:32px;
    padding:36px;
    box-shadow:
    0 10px 30px rgba(0,0,0,.04);
}
.section{
    margin-bottom:32px;
}
.section h2{
    font-size:1.4rem;
    margin-bottom:16px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:12px;
}
.option{
    background:#f3f5f1;
    border:2px solid transparent;
    border-radius:18px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
    font-weight:600;
    text-align:center;
    padding:0 8px;
}
.option:hover{
    transform:translateY(-2px);
}
.option.active{
    background:var(--matcha);
    border-color:var(--matcha-dark);
}
.button{
    width:100%;
    height:64px;
    border:none;
    border-radius:20px;
    background:var(--matcha-dark);
    color:white;
    font-size:1.1rem;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}
.button:hover{
    opacity:.9;
}
#result{
    display:none;
    margin-top:28px;
    padding:30px;
    border-radius:24px;
    text-align:center;
}
#icon{
    font-size:4rem;
    margin-bottom:10px;
}
#title{
    font-size:2rem;
    font-weight:700;
}
#desc{
    margin-top:10px;
    color:#49514a;
    line-height:1.6;
}
.good{
    background:#eef6eb;
}
.warn{
    background:#faf5e8;
}
.bad{
    background:#f8eded;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
            <button class="lang-btn" id="btn-ja" onclick="setLang('ja')">JP</button>
        </div>
    </div>

    <div class="hero">
        <h1 data-i18n="heroTitle">Compatibility Checker</h1>
        <p data-i18n="heroSub">Find out if your PC can run NagisinnraLinux.</p>
    </div>

    <div class="card">
        <div class="section">
            <h2 data-i18n="ramTitle">How much RAM do you have?</h2>
            <div class="grid" id="ramGrid">
                <div class="option" data-val="256MB">256MB</div>
                <div class="option" data-val="512MB">512MB</div>
                <div class="option" data-val="1GB">1GB</div>
                <div class="option" data-val="2GB">2GB</div>
                <div class="option" data-val="4GB">4GB</div>
                <div class="option" data-val="8GB">8GB</div>
                <div class="option" data-val="16GB+">16GB+</div>
            </div>
        </div>

        <div class="section">
            <h2 data-i18n="cpuTitle">What CPU do you have?</h2>
            <div class="grid" id="cpuGrid">
                <div class="option" data-val="Core 2 Duo">Core 2 Duo</div>
                <div class="option" data-val="Core i Series">Core i Series</div>
                <div class="option" data-val="Core Ultra">Core Ultra</div>
                <div class="option" data-val="Ryzen">Ryzen</div>
                <div class="option" data-val="Athlon / FX">Athlon / FX</div>
                <div class="option" data-val="unknown" data-i18n="cpuUnknown">I don't know</div>
            </div>
        </div>

        <button class="button" onclick="checkCompatibility()" data-i18n="checkBtn">
            Check Compatibility
        </button>

        <div id="result">
            <div id="icon"></div>
            <div id="title"></div>
            <div id="desc"></div>
        </div>
    </div>
</div>

<script>
let currentLang = "en";
let selectedRAM = "";
let selectedCPU = "";
let hasChecked = false;

const i18n = {
    en: {
        heroTitle: "Compatibility Checker",
        heroSub: "Find out if your PC can run NagisinnraLinux.",
        ramTitle: "How much RAM do you have?",
        cpuTitle: "What CPU do you have?",
        cpuUnknown: "I don't know",
        checkBtn: "Check Compatibility",
        alertRam: "Select RAM",
        badTitle: "Not Recommended",
        badDesc: "NagisinnraLinux requires at least 2GB RAM. Your system is below the minimum requirement.",
        warnTitle: "Supported",
        warnDesc: "Your PC meets the minimum requirements and should run NagisinnraLinux comfortably.",
        goodTitle: "Excellent",
        goodDesc: "Your PC is ready for the best NagisinnraLinux experience."
    },
    ja: {
        heroTitle: "互換性チェッカー",
        heroSub: "お使いのPCで NagisinnraLinux が動作するか確認しましょう。",
        ramTitle: "メモリ（RAM）の容量はどれくらいですか？",
        cpuTitle: "CPUの種類は何ですか？",
        cpuUnknown: "わからない",
        checkBtn: "互換性をチェックする",
        alertRam: "メモリ（RAM）を選択してください",
        badTitle: "非推奨",
        badDesc: "NagisinnraLinux の動作には最低 2GB のメモリが必要です。最小要件を満たしていません。",
        warnTitle: "動作可能",
        warnDesc: "最小要件を満たしており、NagisinnraLinux を快適に動作させることができます。",
        goodTitle: "非常に快適",
        goodDesc: "NagisinnraLinux を最高のパフォーマンスで体験できるスペックです。"
    }
};

function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    // ボタンのアクティブ状態切り替え
    document.getElementById("btn-en").classList.toggle("active", lang === "en");
    document.getElementById("btn-ja").classList.toggle("active", lang === "ja");

    // 静的テキストの更新
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[lang][key]) {
            el.innerText = i18n[lang][key];
        }
    });

    // すでに診断結果が表示されていれば、結果テキストも即座に翻訳
    if (hasChecked && selectedRAM) {
        renderResult(false);
    }
}

document.querySelectorAll("#ramGrid .option").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll("#ramGrid .option").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        selectedRAM = btn.getAttribute("data-val");
    };
});

document.querySelectorAll("#cpuGrid .option").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll("#cpuGrid .option").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        selectedCPU = btn.getAttribute("data-val");
    };
});

function checkCompatibility() {
    if (!selectedRAM) {
        alert(i18n[currentLang].alertRam);
        return;
    }
    hasChecked = true;
    renderResult(true);
}

function renderResult(shouldScroll) {
    const result = document.getElementById("result");
    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const t = i18n[currentLang];

    const map = {
        "256MB": 0.25,
        "512MB": 0.5,
        "1GB": 1,
        "2GB": 2,
        "4GB": 4,
        "8GB": 8,
        "16GB+": 16
    };
    const ram = map[selectedRAM];

    result.style.display = "block";
    result.className = "";

    if (ram < 2) {
        result.classList.add("bad");
        icon.innerHTML = "❌";
        title.innerHTML = t.badTitle;
        desc.innerHTML = t.badDesc;
    } else if (ram < 8) {
        result.classList.add("warn");
        icon.innerHTML = "⚠️";
        title.innerHTML = t.warnTitle;
        desc.innerHTML = t.warnDesc;
    } else {
        result.classList.add("good");
        icon.innerHTML = "✅";
        title.innerHTML = t.goodTitle;
        desc.innerHTML = t.goodDesc;
    }

    if (shouldScroll) {
        result.scrollIntoView({
            behavior: "smooth"
        });
    }
}
</script>
</body>
</html>
